manifest_version: 1
name: spacefast
description: >-
  Turn an idea into a website, dashboard, report, or small web tool you can share. Build it in your conversation, or bring something you already made, and publish it with Spacefast.
source: https://spacefast.com/setup/hermes
transport:
  type: http
  url: https://mcp.spacefast.com
auth:
  type: oauth
suggest:
  keywords:
    - spacefast
    - publish
  hosts:
    - spacefast.com
post_install: |
  Authenticate in the browser when Hermes prompts you.
  To reconnect manually, run: hermes mcp login spacefast
