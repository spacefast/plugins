manifest_version: 1
name: spacefast
description: >-
  Turn an idea into a website, dashboard, report, or small web tool you can share. Build it in your conversation, or bring something you already made, and publish it with Spacefast.
source: https://spacefast.com/docs/setup/hermes/
transport:
  type: stdio
  command: npx
  args:
    - "-y"
    - "spacefast@latest"
    - mcp
auth:
  type: none
suggest:
  keywords:
    - spacefast
    - publish
  hosts:
    - spacefast.com
post_install: |
  Spacefast runs on this machine through npx, so it needs Node.js 22.19 or later.
  Publishing works before you sign in. When a tool needs your account, Spacefast
  opens a browser to sign in, or run `npx -y spacefast@latest login`.
  Start a new Hermes session so the Spacefast tools load.
